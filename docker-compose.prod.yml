# Production stack for the DigitalOcean droplet.
# Postgres is external (Neon, via DATABASE_URL in .env). Only app + Redis run here.
services:
  app:
    build: .
    image: wtb-app:latest
    container_name: wtb-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Redis is the compose sidecar, not localhost.
      REDIS_URL: redis://redis:6379
      # The droplet has a dead IPv6 route; without this, Node's fetch tries IPv6 first and
      # hangs (Telegram/APIs unreachable). Force IPv4-first DNS resolution.
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: wtb-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TLS reverse proxy for api.stackalpha.xyz → app:3000. Auto Let's Encrypt certs
  # (needs the api DNS A-record pointing at this droplet + ports 80/443 open).
  caddy:
    image: caddy:2-alpine
    container_name: wtb-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  redis_data:
  caddy_data:
  caddy_config:
